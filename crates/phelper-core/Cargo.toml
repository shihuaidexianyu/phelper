[package]
name = "phelper-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Headless engine: capability probe, telemetry, control. Platform adapters live here behind domain ports."

[features]
default = ["pawnio", "nvidia"]
# M2: all write paths. Absent = read-only by construction.
control = []
pawnio = []
# NVAPI is hand-rolled FFI (nvapi_QueryInterface); no external crate.
nvidia = []
# M3: 0x29 writes (staged verification runbook only).
experimental-hp-power-limits = ["control"]
# M3: read-only EC diagnostics. No EC write function exists anywhere (R3).
experimental-ec = []

[dependencies]
phelper-domain = { path = "../phelper-domain" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    # ShellExecuteW self-elevation (elevation.rs) — must be declared here:
    # relying on gpui's transitive copy only links in full-workspace builds
    # (feature unification); `cargo run -p phelper-cli` alone breaks.
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Wmi",
    "Win32_System_Com",
] }

[dev-dependencies]
serde_json.workspace = true
