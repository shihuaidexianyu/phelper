[package]
name = "phelper-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Dev/verification harness for phelper-core. NOT the product UI."
build = "build.rs"

[features]
# The CLI hard-enables phelper-core/control: it IS the §57 Stage 2 dev
# harness for the write path. `experimental` stays opt-in.
experimental = ["phelper-core/experimental-hp-power-limits", "phelper-core/experimental-ec"]

[dependencies]
phelper-core = { path = "../phelper-core", features = ["control"] }
phelper-domain = { path = "../phelper-domain" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing.workspace = true
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
embed-manifest = "1"
