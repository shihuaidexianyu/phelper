[package]
name = "phelper-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPUI desktop shell for phelper (OMEN 16-wf0032TX / board 8BAB). Self-elevating (runas relaunch) — see below."
build = "build.rs"

# The requireAdministrator manifest this crate would need is impossible:
# gpui.lib force-embeds its own asInvoker RT_MANIFEST resource (gpui's
# default-on `windows-manifest` feature, pulled in by gpui-component), and
# Windows allows exactly ONE application manifest resource — any second
# manifest (embed-manifest, embed-resource, link /MANIFESTINPUT) fails the
# link with CVTRES CVT1100. So elevation happens in main() instead:
# not-elevated → ShellExecuteW(runas) relaunch → UAC prompt → exit. The
# final process is always elevated, same UAC-at-launch UX as a manifest.
# Upside: `cargo run -p phelper-desktop` works from ANY shell.
#
# [[bin]] test/bench are disabled anyway: this crate carries ZERO unit
# tests (all logic lives in phelper-core::app and is tested there).
[[bin]]
name = "phelper-desktop"
path = "src/main.rs"
test = false
bench = false

[features]
# The desktop app ships WITH the verified-experimental drawers (0x29 power
# limits / read-only EC diagnostics) — this is the user's own reference
# machine and both passed on-device verification (M3/M4). Build with
# --no-default-features for the stable configuration whose experimental
# drawer is compiled out (HIL gating check).
default = ["experimental"]
experimental = [
    "phelper-core/experimental-hp-power-limits",
    "phelper-core/experimental-ec",
]

[dependencies]
phelper-core = { path = "../../crates/phelper-core", features = ["control"] }
phelper-domain = { path = "../../crates/phelper-domain" }
# futures-channel for the GPUI bridge task — std::sync::mpsc::recv()
# in cx.spawn blocks the GPUI foreground executor (single-threaded)
# and freezes the entire UI. futures::channel::mpsc awaits instead.
futures = { version = "0.3", default-features = false, features = ["async-await"] }
# Dependency pin discipline (architecture.md §45/§62 — upgrades are an
# explicit decision, never a silent float):
#   gpui-component is pinned to commit C below. Its own manifest floats on
#   zed-industries/zed main, so `gpui`/`gpui_platform` must be declared
#   with the SAME floating spec — a rev= pin is a different cargo source-id
#   even at the same commit and produces TWO gpui copies (type-
#   incompatibility, longbridge/gpui-component#2532; verified 2026-08-26).
#   The actual pin is the committed Cargo.lock:
#     pair locked 2026-08-26 =
#       gpui-component 0bfcb640235b7f76c4f764c2fa6454be4cf4711a
#       zed/gpui      45cd77bba0967fd106649956247f3ed6d74e75f6
#   Deliberate upgrade = `cargo update -p gpui --precise <sha>` (plus a new
#   gpui-component rev), then re-verify and commit the lock.
# No extra gpui_platform features: the GPUI README says Windows needs none
# (font-kit is a no-op on Windows; x11/wayland are Linux-only).
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git" }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "0bfcb640235b7f76c4f764c2fa6454be4cf4711a" }
# Tray (architecture.md §45: GPUI ships no tray support; tray-icon fills it).
tray-icon = "0.21"
# HWND extraction from gpui::Window (tray show/hide targets the raw handle).
raw-window-handle = "0.6"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
# The generated resource contains only the app icon. GPUI already owns the
# manifest resource, so this deliberately does not add a second manifest.
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
